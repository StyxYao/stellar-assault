name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - "steam/*"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web bundle
        run: bash tools/build_pages.sh
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Windows installer and zip
        working-directory: desktop
        run: npm run dist:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stellar-assault-windows
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.yml

  linux:
    runs-on: ubuntu-latest
    env:
      PYTHON: python3
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web bundle
        run: bash tools/build_pages.sh
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Linux AppImage
        working-directory: desktop
        run: npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stellar-assault-linux
          if-no-files-found: error
          path: |
            desktop/release/*.AppImage
            desktop/release/*.yml
