name: CI

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check all source modules
        run: |
          node -e "const fs=require('fs'),p=require('path');const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(p.join(d,e.name)):[p.join(d,e.name)]);for(const f of walk('src').filter(f=>f.endsWith('.js')&&f!=='src/worker.js'))new Function(fs.readFileSync(f,'utf8'));console.log('syntax ok',walk('src').length)"
      - name: Structure guardrails
        run: python3 tools/check_structure.py
      - name: Content validation
        run: node tools/validate_content.mjs
      - name: Core tests
        run: |
          node tests/fixed-step.test.mjs
          node tests/math.test.mjs
          node tests/collision.test.mjs
