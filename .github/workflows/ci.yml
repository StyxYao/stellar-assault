name: CI

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check modules and game
        run: |
          node -e "for (const f of ['src/content/enemy-archetypes.js','src/render/player-hitbox.js','game3.js']) new Function(require('fs').readFileSync(f,'utf8'))"
      - name: Structure guardrails
        run: python3 tools/check_structure.py
      - name: Content validation
        run: node tools/validate_content.mjs
      - name: Core tests
        run: node tests/fixed-step.test.mjs
